name: Cleanup Old Releases (Test)

on:
  schedule:
    - cron: "0 3 * * 0"   # daily at 3am UTC
  workflow_dispatch:      # manual trigger, no inputs — just runs with the config below

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 10
          delete_expired_data: 0
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
