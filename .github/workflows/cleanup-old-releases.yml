name: Cleanup Old Release Artifacts

on:
  schedule:
    - cron: "0 15 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: your-username/delete-old-release-artifacts@v1
        with:
          keep-latest: "2"
          max-age-days: "1"
          dry-run: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
